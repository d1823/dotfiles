set -g mode-style "fg=default,bg=default,reverse"

set -g message-style "fg=#eee8d5,bg=#b58900"
set -g message-command-style "fg=#657b83,bg=#fdf6e3"

set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#268bd2"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#268bd2,bg=default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style "fg=#fdf6e3,bg=#93a1a1,bold"

set -g status-left ""
set -g status-right ""

setw -g window-status-activity-style "underscore,fg=#839496,bg=#fdf6e3"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#eee8d5,bg=#93a1a1"
# @cc_state is set on a window by the Claude Code hook claude/.claude/hooks/tmux-state.sh.
set -g @cc_bg '#{?#{==:#{@cc_state},waiting},#b58900,#{?#{==:#{@cc_state},done},#859900,#93a1a1}}'
set -g @cc_marker '#{?#{==:#{@cc_state},waiting}, ●,#{?#{==:#{@cc_state},done}, ✓,}}'
set -g @cc_story_icon '#{?#{E:@cc_story_waiting},●,#{?#{E:@cc_story_done},✓,○}}'
set -g @cc_story_waiting '#{W:#{?#{==:#{@cc_state},waiting}, ●,}}'
set -g @cc_story_done '#{W:#{?#{==:#{@cc_state},done}, ✓,}}'
set -g @cc_story_bg '#{?#{E:@cc_story_waiting},#b58900,#{?#{E:@cc_story_done},#859900,#93a1a1}}'

setw -g window-status-format "#[fg=#fdf6e3,bg=#{E:@cc_bg},nobold,nounderscore,noitalics] #I | #W#{E:@cc_marker} "
setw -g window-status-current-format "#[fg=#fdf6e3,bg=#cb4b16,bold] #I | #W#{E:@cc_marker} "

# Start from tmux's defaults so that re-sourcing copies the real window list, not the blanked spacer.
set -gu status-format
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
set -g 'status-format[2]' '#[fg=#586e75]#{R:─,#{client_width}}'
set -g 'status-format[3]' '#[align=left]#{S:#[range=session|#{session_id}]#[fg=#fdf6e3]#{?#{==:#{session_name},#{client_session}},#[bg=#cb4b16]#[bold],#[bg=#{E:@cc_story_bg}]#[nobold]} #{E:@cc_story_icon} | #S #[norange]}#[default]#[align=right]#[fg=#fdf6e3]#[bg=#93a1a1]#[bold] %H:%M #[default]'
set -g status 4
